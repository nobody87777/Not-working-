<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Quizzes - MultitaskCoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/quizzes.css">
</head>
<body class="dark min-h-screen p-4 max-w-md mx-auto space-y-4">
    <header class="flex items-center justify-between py-2">
        <a href="../index.html" class="sub-card px-3 py-1.5 rounded-xl text-xs font-bold text-purple-400">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back Home
        </a>
        <h1 class="font-extrabold text-sm">Brain Quizzes</h1>
    </header>

    <div class="glass-card p-5 rounded-3xl space-y-4">
        <div id="quizScoreText" class="text-xs font-bold text-purple-400">Score: 0 XP</div>
        <h3 class="font-bold text-xs">What is the time complexity of binary search?</h3>
        <div class="space-y-2">
            <button onclick="selectQuizAnswer(false)" class="w-full text-left p-3 rounded-2xl sub-card text-xs">A) O(N)</button>
            <button onclick="selectQuizAnswer(true)" class="w-full text-left p-3 rounded-2xl sub-card text-xs quiz-option-selected">B) O(log N)</button>
            <button onclick="selectQuizAnswer(false)" class="w-full text-left p-3 rounded-2xl sub-card text-xs">C) O(N^2)</button>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/quizzes.js"></script>
</body>
</html>
