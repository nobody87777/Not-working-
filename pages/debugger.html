<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugger Arena - MultitaskCoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/debugger.css">
</head>
<body class="dark min-h-screen p-4 max-w-md mx-auto space-y-4">
    <header class="flex items-center justify-between py-2">
        <a href="../index.html" class="sub-card px-3 py-1.5 rounded-xl text-xs font-bold text-purple-400">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back Home
        </a>
        <h1 class="font-extrabold text-sm">Debugger Arena</h1>
    </header>

    <div class="glass-card p-5 rounded-3xl space-y-4">
        <h3 class="font-bold text-xs">Spot line with off-by-one bug:</h3>
        <div class="code-box p-3 rounded-2xl code-font text-xs space-y-1">
            <div onclick="solveBugChallenge(1)" class="cursor-pointer hover:bg-white/5 p-1 rounded">1: for (int i = 0; i <= 5; i++)</div>
            <div onclick="solveBugChallenge(2)" class="cursor-pointer hover:bg-white/5 p-1 rounded bug-line-active">2: arr[i] = i * 2;</div>
            <div onclick="solveBugChallenge(3)" class="cursor-pointer hover:bg-white/5 p-1 rounded">3: printf("%d", arr[i]);</div>
        </div>
        <div id="debugStatus" class="text-xs text-center font-bold">Select the buggy line above!</div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/debugger.js"></script>
</body>
</html>
