<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing - MultitaskCoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/typing.css">
</head>
<body class="dark min-h-screen p-4 max-w-md mx-auto space-y-4">
    <header class="flex items-center justify-between py-2">
        <a href="../index.html" class="sub-card px-3 py-1.5 rounded-xl text-xs font-bold text-purple-400">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back Home
        </a>
        <h1 class="font-extrabold text-sm">Speed Typing</h1>
    </header>

    <div class="glass-card p-5 rounded-3xl space-y-4">
        <div class="flex justify-between text-xs font-bold">
            <span>Target Snippet</span>
            <span id="wpmDisplay" class="text-purple-400">0 WPM</span>
        </div>
        <div class="code-box p-3 rounded-2xl code-font text-xs">
            def calculate_sum(a, b):<br>&nbsp;&nbsp;&nbsp;&nbsp;return a + b
        </div>
        <textarea oninput="checkTypingSpeed(this.value)" placeholder="Type snippet here..." class="w-full h-24 sub-card p-3 rounded-2xl code-font text-xs resize-none focus:outline-none"></textarea>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/typing.js"></script>
</body>
</html>
